<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jukeroom</title>
  <meta name="description" content="Listen to YouTube songs together in sync. Start a room, share the code, add songs. Phone or laptop, free, no account.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0b0d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jukeroom">
  <link rel="preload" href="fonts/SpaceGrotesk-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px;font:18px sans-serif">Jukeroom needs JavaScript. Please turn it on in your browser settings.</p></noscript>
  <script src="vendor/peerjs.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
